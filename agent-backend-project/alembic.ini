[alembic]
script_location = alembic
prepend_sys_path = .
# NOTE: keep this file ASCII-only. Alembic reads alembic.ini with the OS locale
# codec (GBK on this Windows machine), so a UTF-8 Chinese comment here makes
# every alembic command fail with UnicodeDecodeError.
# NOTE: the connection URL is intentionally NOT set here. It used to hardcode the
# root password in plaintext (and a database name that does not exist). Now
# alembic/env.py reads it from app.core.settings, i.e. MYSQL_URL in .env.<APP_ENV>.
# sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
